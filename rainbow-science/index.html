<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手指尖的彩虹·互动科学课堂</title><style>body{margin:0;background:#0b1427;color:#f3f8ff;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:930px;margin:auto;padding:24px}h1{font-size:clamp(36px,7vw,64px);margin:12px 0}p{color:#bbcfeb}article{background:#1a2948;border:1px solid #45547a;border-radius:20px;padding:22px;margin:20px 0}h2{color:#8be4ff}svg{width:100%;height:210px;background:#081022;border-radius:12px}input{width:70%;accent-color:#76e5ff}button{background:#83ddf7;border:0;border-radius:10px;padding:11px 15px;margin:5px;font-weight:bold;color:#0b1427}label{display:block;padding:12px 0}#progress{color:#f6d789}.opt{display:block;width:100%;text-align:left;background:#283e63;color:white;margin:7px 0}.selected{background:#87dfe9;color:#101629}.feedback{color:#adf9c7}</style><main><p>10月17日 · 科学课程回顾</p><h1>🌈 手指尖的彩虹</h1><p>亲手操作光学实验，改变参数、观察变化、回答问题。以下图形是原理示意，不代表实验测量。</p><p id="progress">已完成 0 / 4 个实验</p><section id="lab"></section><h2>🧠 科学小侦探</h2><section id="quiz"></section><button id="submit">提交测验</button><button id="reset">重新答题</button><p id="score"></p><article><h2>课后探索</h2><p>用三棱镜观察阳光色散；观察旧CD表面的彩虹；尝试按“观察—猜想—验证—结论”记录现象。</p><p>注意安全：勿直视太阳，勿将激光照向眼睛，使用剪刀请由成人陪同。</p></article></main><script>
const labs=[["三棱镜·光的色散","调节不同颜色光束的分离程度",0,100,50],["双缝·光的干涉","改变缝间距，观察条纹密度",1,10,5],["窄缝·光的衍射","改变缝宽，观察扩散范围",1,10,5],["反射·悬浮影像","调整透明反射成像的亮度",0,100,60]], done=new Set(),colors=["#ff6575","#ffb45c","#f7e768","#75eab7","#6ec8ff","#af9bfc"];let nums=labs.map(l=>l[4]);let lab=document.getElementById("lab");labs.forEach((l,i)=>{let a=document.createElement("article");a.innerHTML='<h2>'+(i+1)+'. '+l[0]+'</h2><svg viewBox="0 0 420 210" id="scene'+i+'"></svg><label>'+l[1]+'</label><button data-minus="'+i+'">－</button><input id="range'+i+'" type="range" min="'+l[2]+'" max="'+l[3]+'" value="'+l[4]+'"><button data-plus="'+i+'">＋</button> <b id="value'+i+'"></b><p id="explain'+i+'"></p><button data-done="'+i+'">✓ 我已观察完成</button><p id="done'+i+'"></p>';lab.appendChild(a)});function draw(i){let v=nums[i],s=document.getElementById("scene"+i);document.getElementById("value"+i).textContent=v;s.innerHTML='';const ns="http://www.w3.org/2000/svg";function e(n,attrs){let x=document.createElementNS(ns,n);Object.entries(attrs).forEach(([k,val])=>x.setAttribute(k,val));s.appendChild(x)}if(i===0){e("path",{d:"M0 105H160",stroke:"white","stroke-width":6});e("polygon",{points:"170,35 245,175 92,175",fill:"#a3eaff", "fill-opacity":".13",stroke:"#b7ecff","stroke-width":2});colors.forEach((c,j)=>e("path",{d:"M185 105L420 "+(105+(j-2.5)*(5+v*.22)),stroke:c,"stroke-width":5}));}if(i===1){for(let x=15;x<405;x+=3)e("rect",{x,y:30,width:3,height:150,fill:"#7cd2ff",opacity:(.06+.92*(1+Math.cos((x-210)*v*.11))/2).toFixed(3)});}if(i===2){let w=100/v+12;e("path",{d:"M160 105 Q280 "+(105-w*1.8)+" 420 "+(105-w)+"L420 "+(105+w)+"Q280 "+(105+w*1.8)+" 160 105",fill:"#6abaff",opacity:".4"});e("path",{d:"M0 105H160",stroke:"#addbff","stroke-width":7});e("path",{d:"M160 0V88M160 122V210",stroke:"#8299bb","stroke-width":10});}if(i===3){e("polygon",{points:"160,30 260,30 345,192 70,192",fill:"#93dfff","fill-opacity":".08",stroke:"#9deeff"});let txt=document.createElementNS(ns,"text");txt.setAttribute("x",210);txt.setAttribute("y",134);txt.setAttribute("text-anchor","middle");txt.setAttribute("font-size",67);txt.setAttribute("opacity",v/100);txt.textContent="🦋";s.appendChild(txt);}document.getElementById("explain"+i).textContent=["白光原本包含多种颜色，三棱镜使不同颜色的光偏折不同。","双缝间距增大，明暗条纹会变密（其他条件不变）。","窄缝越窄，衍射产生的中央亮纹通常越宽。","简易手机悬浮投影多基于佩珀尔幻象，并非真正的全息技术。"][i];}function set(i,v){nums[i]=Math.max(labs[i][2],Math.min(labs[i][3],v));document.getElementById("range"+i).value=nums[i];draw(i)}labs.forEach((_,i)=>{draw(i);document.getElementById("range"+i).oninput=e=>set(i,+e.target.value)});document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>set(+b.dataset.minus,nums[+b.dataset.minus]-1));document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>set(+b.dataset.plus,nums[+b.dataset.plus]+1));document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{let i=+b.dataset.done;done.add(i);document.getElementById("done"+i).textContent="🌟 已记录";document.getElementById("progress").textContent="已完成 "+done.size+" / 4 个实验";});
const questions=[["白光通过三棱镜为什么变彩色？",["三棱镜发光","不同颜色偏折不同","白光只有红色"],1,"白光包含多种颜色，折射偏折不同。"],["雨后彩虹与什么有关？",["折射、色散及内部反射","云朵发光","天空染色"],0,"阳光在水滴中经历折射、内部反射和色散。"],["明暗干涉条纹如何产生？",["光消失了","光波相互叠加增强或减弱","只有反射"],1,"相干光波叠加产生明暗差别。"],["光经过很窄的缝隙后扩展是？",["色散","吸收","衍射"],2,"光的衍射反映其波动性。"],["透明四棱锥投影常用什么原理？",["真的悬浮","透明表面反射成虚像","真实全息记录"],1,"通常是佩珀尔幻象，而非真正全息。"]];let selected={};const qbox=document.getElementById("quiz");questions.forEach((q,i)=>{let a=document.createElement("article");a.innerHTML="<h3>"+(i+1)+". "+q[0]+"</h3>";q[1].forEach((o,j)=>{let b=document.createElement("button");b.className="opt";b.textContent="ABC"[j]+". "+o;b.onclick=()=>{selected[i]=j;a.querySelectorAll(".opt").forEach((x,k)=>x.classList.toggle("selected",k===j));};a.appendChild(b)});let f=document.createElement("p");f.className="feedback";a.appendChild(f);qbox.appendChild(a)});document.getElementById("submit").onclick=()=>{if(Object.keys(selected).length<5){document.getElementById("score").textContent="请先回答所有五道题";return;}let score=0;questions.forEach((q,i)=>{if(selected[i]===q[2])score++;qbox.children[i].querySelector(".feedback").textContent=(selected[i]===q[2]?"✅ 正确。":"正确答案："+("ABC"[q[2]])+"。")+q[3]});document.getElementById("score").textContent="得分："+score+" / 5"};document.getElementById("reset").onclick=()=>{selected={};document.querySelectorAll(".opt").forEach(x=>x.classList.remove("selected"));document.querySelectorAll(".feedback").forEach(x=>x.textContent="");document.getElementById("score").textContent=""};
</script></html>
